[General]
network = fleetqox.omnetpp.FleetQoxTraceReplay
sim-time-limit = 5s
seed-set = 1

cmdenv-express-mode = true
cmdenv-performance-display = false
record-eventlog = false
**.scalar-recording = false
**.vector-recording = false

*.numRobots = 8
*.traceFile = ""
*.linkDataRate = 54Mbps
# These are per-link values. The parity runner supplies half of its target
# end-to-end delay and 1-sqrt(1-targetPER) for the two-link path.
*.linkDelay = 1ms
*.linkPacketErrorRate = 0
*.startOffset = 100ms

[Config MatchedP2p]
description = "Matched routed P2P trace/seed/rate/delay/PER replay for ns-3 parity"

[Config TsnMixedFleet]
description = "Wired runtime base for future 802.1Qbv/Qav TSN queue configuration"

[Config MeshDegraded]
description = "Wired runtime base only; mobile MANET/mesh fidelity is not claimed"

[Config MatchedWifi]
description = "Matched single-AP 802.11g infrastructure trace/seed/bitrate/spacing/speed replay for ns-3 wifi-topology parity"
network = fleetqox.omnetpp.FleetQoxWifiReplay
*.numRobots = 8
*.traceFile = ""
*.wlanBitrate = 54Mbps
*.stationSpacing = 3m
*.mobilitySpeed = 0mps
*.startOffset = 1s

# Fixed AP identity so the Simplified mgmt modules associate immediately
# instead of depending on beacon/probe timing within the short replay window.
**.ap.wlan[*].address = "10:00:00:00:00:00"
**.**.mgmt.accessPointAddress = "10:00:00:00:00:00"

# ns-3's ConstantVelocityMobilityModel lets stations drift indefinitely with
# no boundary; keep the constraint area far larger than any station can
# travel in a few seconds so LinearMobility's wall-reflection never triggers.
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 10000m
**.constraintAreaMaxY = 10000m
**.constraintAreaMaxZ = 0m

# All stations start replaying the matched trace at the exact same
# startOffset tick, so their first ARP broadcast collides at precisely the
# same simulation time. INET's RadioMedium treats an exact tie as a likely
# modeling bug (real independent transmitters essentially never start at the
# identical instant) and errors out by default. ns-3 has no equivalent
# check and tolerates this fine; since the synchronized start is a
# deliberate parity choice (same trace/seed/startOffset feeding both
# simulators), not a real bug, disable the guard here to match ns-3's
# behavior rather than desynchronizing the replay to dodge the warning.
**.radioMedium.sameTransmissionStartTimeCheck = "ignore"

# INET's PendingQueue (per-station MAC transmit queue) defaults to a
# 100-packet capacity; ns-3's WifiMacQueue defaults to 500 (confirmed via
# ns3::WifiMacQueue::GetMaxSize() at runtime). At high contention the
# smaller default queue tail-drops under load instead of letting packets
# queue the way ns-3 does, which understated latency (packets that would
# have queued and arrived late in ns-3 were dropped early in INET instead)
# and was a real, measured contributor to the wifi-parity gap at 16/32
# stations -- not just an inherent CSMA/CA modeling difference. Match
# ns-3's capacity for an apples-to-apples comparison.
**.wlan[*].mac.dcf.channelAccess.pendingQueue.packetCapacity = 500

# When --wifi-qos enables qosStation, INET routes data frames through
# mac.hcf.edca.edcaf[0..3] (one PendingQueue per Access Category) instead
# of mac.dcf.channelAccess -- a completely separate module tree (see
# Hcf.ned/Edca.ned/Edcaf.ned), so the override above silently stops
# applying and each AC's queue reverts to the same 100-packet default this
# file already documented as a real, measured parity gap. Cover the QoS
# path with the same capacity for consistency.
**.wlan[*].mac.hcf.edca.edcaf[*].pendingQueue.packetCapacity = 500

# INET's default Arp module retries a lost ARP request after 1s
# (retryTimeout, inet/networklayer/arp/ipv4/Arp.ned). Because every host
# starts replaying the matched trace at the identical startOffset tick (see
# the sameTransmissionStartTimeCheck note above), ARP broadcasts from all
# stations are unusually likely to collide with each other at that exact
# instant -- a synthetic artifact of the synchronized replay start, not
# something a real deployment would see. When that first ARP request is
# lost, every queued app packet to that destination head-of-line-blocks
# for the full 1s retry wait, producing a large one-off p99 latency outlier
# for that one (source, destination) pair -- confirmed by instrumenting
# TraceDrivenUdpApp to log outlier packets, which all shared one src/dst
# pair and released together after ~1s. ns-3's model does not show this
# artifact (its address resolution isn't part of the replayed workload
# either). Use GlobalArp (address resolution with no protocol exchange, so
# nothing to collide) to remove this synchronized-start artifact rather
# than let it masquerade as wifi-MAC divergence.
**.arp.typename = "GlobalArp"

[Config MatchedWifiRng]
description = "MatchedWifi plus ns-3-matched per-station MRG32k3a backoff RNG (see MatchedMrg32k3aRng.{h,cc} and fleetqox_trace_replay.cc's --matchedBackoffRng) for cross-simulator RNG-alignment investigation"
extends = MatchedWifi
rng-class = "MatchedMrg32k3aRng"
# num-rngs and each station's wlan[*].mac.dcf.channelAccess.contention.
# matchedBackoffRngIndex are supplied per-run via CLI overrides by
# run_omnetpp_docker_wifi_parity.py (station count varies with --robots),
# mirroring the ns-3 side's --matchedBackoffRng/--matchedBackoffRngBase.
